
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Nova Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: white;
      background: linear-gradient(145deg, #111827, #273c75, #6c5ce7);
      background-attachment: fixed;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 18px 10px;
    }
    .clock { font-size: 32px; font-weight: 700; }
    .date { opacity: .8; font-size: 13px; }
    main { padding: 14px; }
    .search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ffffff35;
      border-radius: 18px;
      background: #ffffff1a;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .search::placeholder { color: #ffffffb0; }
    h3 { margin: 24px 4px 14px; }
    .apps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .app {
      min-height: 105px;
      padding: 16px 5px;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      background: #ffffff15;
      color: white;
      font: inherit;
      cursor: pointer;
      text-align: center;
    }
    .app:active { transform: scale(.96); }
    .emoji { display: block; font-size: 32px; margin-bottom: 8px; }
    .panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 20px;
      background: #101827e8;
      border: 1px solid #ffffff30;
    }
    .panel h2 { margin-top: 0; }
    .panel button, .panel a {
      display: inline-block;
      margin: 5px 3px;
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      padding: 12px;
      border-radius: 12px;
      font: inherit;
    }
    .dock {
      display: flex;
      justify-content: space-around;
      margin: 24px 0 10px;
      padding: 14px 5px;
      border-radius: 22px;
      background: #ffffff18;
    }
    .dock button {
      border: 0;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }
    .hint { font-size: 12px; opacity: .7; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div style="font-size:30px">🌤️</div>
  </header>

  <main>
    <input class="search" id="search" placeholder="🔎 جست‌وجوی برنامه‌ها..." oninput="filterApps()">

    <h3>برنامه‌های من</h3>
    <div class="apps" id="apps">
      <button class="app" data-name="strike zone بازی" onclick="openGame()">
        <span class="emoji">🎯</span>Strike Zone
      </button>
      <button class="app" data-name="یادداشت notes" onclick="showPanel('notes')">
        <span class="emoji">📝</span>یادداشت‌ها
      </button>
      <button class="app" data-name="ماشین حساب calculator" onclick="showPanel('calc')">
        <span class="emoji">🧮</span>ماشین حساب
      </button>
      <button class="app" data-name="تقویم calendar" onclick="showPanel('calendar')">
        <span class="emoji">📅</span>تقویم
      </button>
      <button class="app" data-name="موسیقی music" onclick="showPanel('music')">
        <span class="emoji">🎵</span>موسیقی
      </button>
      <button class="app" data-name="تنظیمات settings" onclick="showPanel('settings')">
        <span class="emoji">⚙️</span>تنظیمات
      </button>
    </div>

    <section class="panel" id="notes">
      <h2>📝 یادداشت‌ها</h2>
      <textarea id="noteText" placeholder="یادداشتت رو بنویس..."></textarea>
      <button onclick="saveNote()">ذخیره یادداشت</button>
      <button onclick="closePanels()">بستن</button>
      <p id="saveStatus"></p>
    </section>

    <section class="panel" id="calc">
      <h2>🧮 ماشین حساب</h2>
      <input class="search" id="calcInput" placeholder="مثلاً 12*(5+2)">
      <button onclick="calculate()">محاسبه</button>
      <p id="calcResult">نتیجه: —</p>
      <button onclick="closePanels()">بستن</button>
    </section>

    <section class="panel" id="calendar">
      <h2>📅 تقویم</h2>
      <p id="calendarDate"></p>
      <button onclick="closePanels()">بستن</button>
    </section>

    <section class="panel" id="music">
      <h2>🎵 موسیقی</h2>
      <p>برای پخش موسیقی، فایل صوتی دلخواهت رو از گوشی انتخاب کن.</p>
      <input type="file" accept="audio/*" id="audioFile">
      <audio id="audioPlayer" controls style="width:100%;margin-top:12px"></audio>
      <button onclick="closePanels()">بستن</button>
    </section>

    <section class="panel" id="settings">
      <h2>⚙️ تنظیمات</h2>
      <p>پس‌زمینه لانچر رو تغییر بده:</p>
      <button onclick="setTheme(1)">آبی</button>
      <button onclick="setTheme(2)">بنفش</button>
      <button onclick="setTheme(3)">سبز</button>
      <button onclick="closePanels()">بستن</button>
    </section>

    <div class="dock">
      <button onclick="home()" title="خانه">🏠</button>
      <button onclick="openGame()" title="بازی">🎯</button>
      <button onclick="showPanel('settings')" title="تنظیمات">⚙️</button>
    </div>
    <p class="hint">Nova Launcher • نسخه وب</p>
  </main>

  <script>
    const GAME_URL = "https://jeyt082-sudo.github.io/strike-zone/";

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("fa-IR", {hour:"2-digit", minute:"2-digit"});
      document.getElementById("date").textContent =
        now.toLocaleDateString("fa-IR", {weekday:"long", day:"numeric", month:"long"});
      document.getElementById("calendarDate").textContent =
        now.toLocaleDateString("fa-IR", {year:"numeric", month:"long", day:"numeric"});
    }
    updateClock();
    setInterval(updateClock, 1000);

    function openGame() {
      window.open(GAME_URL, "_blank");
    }

    function showPanel(id) {
      closePanels();
      document.getElementById(id).style.display = "block";
      document.getElementById(id).scrollIntoView({behavior:"smooth", block:"nearest"});
    }

    function closePanels() {
      document.querySelectorAll(".panel").forEach(p => p.style.display = "none");
    }

    function home() {
      closePanels();
      document.getElementById("search").value = "";
      filterApps();
      window.scrollTo({top:0, behavior:"smooth"});
    }

    function filterApps() {
      const query = document.getElementById("search").value.toLowerCase();
      document.querySelectorAll(".app").forEach(app => {
        app.style.display = app.dataset.name.toLowerCase().includes(query) ? "" : "none";
      });
    }

    function saveNote() {
      try {
        localStorage.setItem("nova-note", document.getElementById("noteText").value);
        document.getElementById("saveStatus").textContent = "یادداشت ذخیره شد ✅";
      } catch(e) {
        document.getElementById("saveStatus").textContent = "ذخیره‌سازی در این مرورگر در دسترس نیست.";
      }
    }

    try {
      document.getElementById("noteText").value = localStorage.getItem("nova-note") || "";
    } catch(e) {}

    function calculate() {
      const input = document.getElementById("calcInput").value.trim();
      if (!input || !/^[0-9+\-*/().%\s]+$/.test(input)) {
        document.getElementById("calcResult").textContent = "عبارت ریاضی معتبر وارد کن.";
        return;
      }
      try {
        const result = Function('"use strict"; return (' + input + ')')();
        document.getElementById("calcResult").textContent =
          Number.isFinite(result) ? "نتیجه: " + result : "عبارت قابل محاسبه نیست.";
      } catch(e) {
        document.getElementById("calcResult").textContent = "عبارت ریاضی درست نیست.";
      }
    }

    document.getElementById("audioFile").addEventListener("change", function() {
      if (this.files && this.files[0]) {
        document.getElementById("audioPlayer").src = URL.createObjectURL(this.files[0]);
      }
    });

    function setTheme(theme) {
      const backgrounds = {
        1: "linear-gradient(145deg,#111827,#273c75,#6c5ce7)",
        2: "linear-gradient(145deg,#2d0b48,#6c3483,#e056fd)",
        3: "linear-gradient(145deg,#0b3d2e,#16875d,#80cfa9)"
      };
      document.body.style.background = backgrounds[theme];
      document.body.style.backgroundAttachment = "fixed";
    }
  </script>
</body>
</html>
