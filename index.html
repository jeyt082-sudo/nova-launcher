
<div id="launcherChooser" style="max-width:420px;margin:40px auto;padding:24px;text-align:center;background:#171a2b;color:white;border-radius:24px;font-family:Arial,sans-serif">
  <h1 style="font-size:28px">Select Launcher</h1>
  <p style="color:#b9c4e8">Choose your launcher</p>

  <button onclick="selectLauncher('POCO Launcher')" style="display:block;width:100%;padding:18px;margin:14px 0;border:1px solid #ffffff22;border-radius:16px;background:#293557;color:white;font-size:18px">
    📱 POCO Launcher
  </button>

  <button onclick="selectLauncher('Nova Launcher')" style="display:block;width:100%;padding:18px;margin:14px 0;border:1px solid #ffffff22;border-radius:16px;background:#293557;color:white;font-size:18px">
    🚀 Nova Launcher
  </button>

  <p id="launcherMessage" style="color:#aab7ff"></p>
</div>

<script>
function selectLauncher(name) {
  document.getElementById('launcherMessage').textContent =
    'انتخاب شد: ' + name;

  if (name === 'Nova Launcher') {
    window.location.href = 'https://jeyt082-sudo.github.io/nova-launcher/';
  } else {
    document.getElementById('launcherMessage').textContent =
      'برای باز کردن POCO Launcher واقعی، از تنظیمات گوشی استفاده کن.';
  }
}
</script>
