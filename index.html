
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Nova Launcher - لانچر شخصی و وب‌اپلیکیشن">
  <title>Nova Launcher</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, #293c68, transparent 45%),
        linear-gradient(145deg, #101827, #17152e);
      padding: 22px 18px 110px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      opacity: .85;
      margin-bottom: 35px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 35px;
      margin: 0 0 8px;
    }

    header p {
      color: #c4c9e8;
      margin: 0;
    }

    .section-title {
      font-size: 18px;
      margin: 24px 0 15px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px 12px;
    }

    .app {
      color: white;
      text-decoration: none;
      text-align: center;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 15px 5px;
      min-width: 0;
      cursor: pointer;
    }

    .app:active {
      transform: scale(.96);
    }

    .app-icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      font-size: 27px;
      background: linear-gradient(145deg, #7164f5, #4032a8);
    }

    .app span:last-child {
      display: block;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 28px;
      padding: 17px;
      background: rgba(255,255,255,.07);
      border-radius: 18px;
      color: #d5d9f5;
      line-height: 1.8;
      font-size: 14px;
    }

    #installApp {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      width: max-content;
      max-width: calc(100% - 30px);
      padding: 15px 24px;
      border: 0;
      border-radius: 16px;
      background: #7164f5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      cursor: pointer;
    }

    #installApp:active {
      transform: translateX(-50%) scale(.96);
    }

    #message {
      display: none;
      position: fixed;
      z-index: 100000;
      bottom: 85px;
      left: 15px;
      right: 15px;
      padding: 15px;
      border-radius: 14px;
      background: #252c46;
      color: white;
      line-height: 1.9;
      white-space: pre-line;
      box-shadow: 0 5px 25px rgba(0,0,0,.35);
    }

    #message.show {
      display: block;
    }

    .bottom-label {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #b9bfdc;
      background: rgba(12,15,30,.8);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="status">
    <span>Nova OS</span>
    <span id="clock">--:--</span>
  </div>

  <header>
    <h1>Nova Launcher</h1>
    <p>لانچر شخصی تو، همیشه همراهت</p>
  </header>

  <h2 class="section-title">برنامه‌های من</h2>

  <main class="apps">
    <a class="app" href="https://jeyt082-sudo.github.io/strike-zone/">
      <span class="app-icon">🎮</span>
      <span>Strike Zone</span>
    </a>

    <button class="app" type="button" onclick="openNotes()">
      <span class="app-icon">📝</span>
      <span>یادداشت‌ها</span>
    </button>

    <button class="app" type="button" onclick="openCalculator()">
      <span class="app-icon">🧮</span>
      <span>ماشین‌حساب</span>
    </button>

    <button class="app" type="button" onclick="openCalendar()">
      <span class="app-icon">📅</span>
      <span>تقویم</span>
    </button>

    <button class="app" type="button" onclick="openMusic()">
      <span class="app-icon">🎵</span>
      <span>موسیقی</span>
    </button>

    <button class="app" type="button" onclick="openSettings()">
      <span class="app-icon">⚙️</span>
      <span>تنظیمات</span>
    </button>
  </main>

  <div class="note">
    <strong>به Nova Launcher خوش آمدی!</strong>
    <br>
    برای باز کردن بازی Strike Zone روی آیکون آن بزن.
    برای نصب لانچر روی صفحه اصلی، دکمه نصب پایین صفحه را بزن.
  </div>

  <div id="message" role="status" aria-live="polite"></div>

  <button id="installApp" type="button" onclick="installNova()">
    📲 نصب Nova Launcher
  </button>

  <div class="bottom-label">Nova Launcher • نسخه وب</div>

  <script>
    const installButton = document.getElementById("installApp");
    const messageBox = document.getElementById("message");

    let installPrompt = null;
    let messageTimer = null;

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.classList.add("show");

      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        messageBox.classList.remove("show");
      }, 8000);
    }

    function isInstalled() {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.matchMedia("(display-mode: fullscreen)").matches ||
             window.navigator.standalone === true;
    }

    function updateInstallButton() {
      if (isInstalled()) {
        installButton.style.display = "none";
      } else {
        installButton.style.display = "block";
      }
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      updateInstallButton();
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.style.display = "none";
      showMessage("Nova Launcher با موفقیت نصب شد!");
    });

    async function installNova() {
      if (isInstalled()) {
        installButton.style.display = "none";
        showMessage("Nova Launcher از قبل نصب شده است.");
        return;
      }

      if (installPrompt) {
        installButton.disabled = true;

        try {
          await installPrompt.prompt();
          const choice = await installPrompt.userChoice;

          if (choice && choice.outcome === "accepted") {
            showMessage("درخواست نصب تأیید شد.");
          } else {
            showMessage("نصب انجام نشد. هر وقت خواستی دوباره امتحان کن.");
          }
        } catch (error) {
          showMessage(
            "نصب خودکار در دسترس نیست.\n" +
            "منوی مرورگر را باز کن و گزینه نصب را انتخاب کن."
          );
        } finally {
          installPrompt = null;
          installButton.disabled = false;
          updateInstallButton();
        }

        return;
      }

      showMessage(
        "برای افزودن Nova Launcher به صفحه اصلی:\n\n" +
        "۱. سایت را با Chrome باز کن.\n" +
        "۲. منوی سه‌نقطه مرورگر را باز کن.\n" +
        "۳. گزینه Install app یا Add to Home screen را بزن.\n" +
        "۴. افزودن یا نصب را تأیید کن.\n\n" +
        "اگر گزینه نصب وجود ندارد، کمی بعد دوباره امتحان کن یا Chrome را به‌روز کن."
      );
    }

    function openNotes() {
      const saved = localStorage.getItem("nova-notes") || "";
      const text = prompt("یادداشتت را بنویس:", saved);

      if (text !== null) {
        localStorage.setItem("nova-notes", text);
        showMessage("یادداشت ذخیره شد.");
      }
    }

    function openCalculator() {
      const first = prompt("عدد اول را وارد کن:");
      if (first === null || first.trim() === "") return;

      const second = prompt("عدد دوم را وارد کن:");
      if (second === null || second.trim() === "") return;

      const a = Number(first);
      const b = Number(second);

      if (!Number.isFinite(a) || !Number.isFinite(b)) {
        showMessage("لطفاً عدد معتبر وارد کن.");
        return;
      }

      const operation = prompt("عملیات را انتخاب کن: +  -  *  /", "+");
      let result;

      switch (operation) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/":
          if (b === 0) {
            showMessage("تقسیم بر صفر امکان‌پذیر نیست.");
            return;
          }
          result = a / b;
          break;
        default:
          showMessage("عملیات معتبر نیست.");
          return;
      }

      showMessage("نتیجه: " + result);
    }

    function openCalendar() {
      showMessage("امروز: " + new Date().toLocaleDateString("fa-IR"));
    }

    function openMusic() {
      showMessage("برای پخش موسیقی هنوز باید فایل یا سرویس موسیقی اضافه شود.");
    }

    function openSettings() {
      const choice = confirm("می‌خواهی رنگ پس‌زمینه را تغییر بدهی؟");

      if (choice) {
        document.body.style.background =
          "linear-gradient(145deg, #172d2a, #101827)";
      }
    }

    function updateClock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("fa-IR", {
          hour: "2-digit",
          minute: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 30000);
    updateInstallButton();

    window.addEventListener("pageshow", updateInstallButton);
    window.matchMedia("(display-mode: standalone)").addEventListener?.(
      "change",
      updateInstallButton
    );

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.error("Service Worker error:", error));
      });
    }
  </script>
</body>
</html>
